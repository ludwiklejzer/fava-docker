name: Build and Publish Docker Image
on:
  push:
    branches: ["main"]
  workflow_dispatch: # allows running the workflow manually from the Actions tab
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get latest Fava version from PyPI
        id: fava
        run: |
          VERSION=$(curl -fsS https://pypi.org/pypi/fava/json | jq -r .info.version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Fava version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0
      - name: Log in to the container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.fava.outputs.version }}
            type=raw,value=latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FAVA_VERSION=${{ steps.fava.outputs.version }}
